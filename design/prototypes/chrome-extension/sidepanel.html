<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tachigo Prototype</title>
    <link rel="stylesheet" href="src/styles/global.css" />
  </head>
  <body>
    <main class="extension-shell">
      <section class="panel-frame" aria-label="Tachigo extension prototype">
        <section class="screen opening-screen" id="openingScreen" aria-label="Tachigo opening screen">
          <div class="opening-video-stack" aria-hidden="true">
            <video class="opening-video is-active" id="opening01" src="public/assets/first-page/opening-01.mp4" muted playsinline preload="auto"></video>
            <video class="opening-video" id="opening02" src="public/assets/first-page/opening-02.mp4" muted playsinline preload="auto"></video>
          </div>
          <button class="opening-logo-button" id="openingLogoButton" type="button" aria-label="Enter Tachigo">
            <img src="public/assets/first-page/logo.svg" data-asset="logo" alt="Tachigo" />
          </button>
        </section>

        <section class="screen login-screen" id="loginScreen" aria-label="Tachigo login screen" hidden>
          <img class="login-background" src="public/assets/login/login-background.svg" data-asset="loginBackground" alt="" />
          <form class="login-panel" id="loginForm">
            <img class="login-character" src="public/assets/login/login-character.svg" data-asset="loginCharacter" alt="" />
            <div class="login-controls">
              <img class="login-subtitle" src="public/assets/login/login-subtitle.svg" data-asset="loginSubtitle" alt="Mine watch earn" />
              <label class="login-field">
                <img src="public/assets/login/login-input-email.svg" data-asset="loginEmailInput" alt="" />
                <input type="email" placeholder="Enter your email address" autocomplete="email" required />
              </label>
              <label class="login-field" id="passwordField">
                <img src="public/assets/login/login-input-password.svg" data-asset="loginPasswordInput" alt="" />
                <input type="password" placeholder="Enter your password" autocomplete="current-password" required />
              </label>
              <button class="login-text-button login-forgot" id="forgotButton" type="button">Forgot Password?</button>
              <button class="login-primary-button" type="submit" aria-label="Login">
                <img src="public/assets/login/login-button.svg" data-asset="loginButton" alt="Login" />
              </button>
              <img class="login-or" src="public/assets/login/login-or.svg" data-asset="loginOr" alt="or" />
              <button class="login-twitch-button" id="twitchLoginButton" type="button" aria-label="Login with Twitch">
                <img src="public/assets/login/login-button-twitch.svg" data-asset="loginTwitchButton" alt="Login with Twitch" />
              </button>
              <p class="login-signup">
                <span id="signupCopy">Don't have an account?</span>
                <button id="signupButton" type="button">SIGN UP</button>
              </p>
            </div>
          </form>
        </section>

        <section class="screen character-screen" id="characterScreen" aria-label="Choose your character" hidden>
          <div class="character-bg" aria-hidden="true"></div>
          <header class="character-header">
            <img class="character-title" src="public/assets/character-select/title.svg" data-asset="characterTitle" alt="Choose your character" />
            <button class="character-dive-button" id="diveInButton" type="button" aria-label="Let's dive in">
              <img src="public/assets/character-select/dive-in-button.svg" data-asset="characterDiveButton" alt="LET'S DIVE IN" />
            </button>
          </header>
          <div class="character-carousel">
            <button class="character-arrow character-arrow-left" type="button" aria-label="Previous character">
              <img src="public/assets/character-select/left-arrow.svg" data-asset="characterLeftArrow" alt="" />
            </button>
            <video class="character-video" id="characterVideo" src="public/assets/character-select/crab-character-loop.mp4" muted loop playsinline preload="auto"></video>
            <button class="character-arrow character-arrow-right" type="button" aria-label="Next character">
              <img src="public/assets/character-select/right-arrow.svg" data-asset="characterRightArrow" alt="" />
            </button>
          </div>
          <div class="character-name">
            <h1>Crab</h1>
            <p>A calm and wise wanderer who moves gently through the depths, carrying ancient stories within</p>
          </div>
          <img class="character-dots" src="public/assets/character-select/page-icon.svg" data-asset="characterPageDots" alt="" />
        </section>

        <section class="screen mining-screen" id="miningScreen" aria-label="Tachigo mining screen" hidden>
          <div class="mining-video-stack" aria-hidden="true">
            <video class="mining-video is-active" id="sayHiVideo" src="public/assets/crab/say-hi/say-hi-loop.mp4" muted playsinline preload="auto"></video>
            <video class="mining-video" id="idleVideo" src="public/assets/crab/idle/idle-loop.mp4" muted playsinline preload="auto"></video>
            <video class="mining-video" id="miningActionVideo" src="public/assets/crab/mining/mining-loop.mp4" muted playsinline preload="auto"></video>
          </div>
          <div class="mining-hud" aria-label="Tachigo mining HUD">
            <button class="settings-button" type="button" aria-label="Settings">
              <img src="public/assets/icon-button/setting-icon.svg" data-asset="hud.settings" alt="" />
            </button>
            <button class="mine-hit-area" id="mineButton" type="button" aria-label="Mine Tachigo crystal"></button>
            <div class="arrows-indicator" aria-hidden="true">
              <img src="public/assets/icon-button/arrows.svg" data-asset="hud.arrows" alt="" />
            </div>
            <footer class="bottom-stats-bar" aria-label="Mining stats">
              <div class="stat-item">
                <img src="public/assets/icon-button/pre-click-icon.svg" data-asset="hud.perClick" alt="" />
                <strong id="clickPower">1</strong>
                <span>PER CLICK</span>
              </div>
              <div class="stat-item">
                <img src="public/assets/icon-button/level-icon.svg" data-asset="hud.level" alt="" />
                <strong>1</strong>
                <span>LEVEL</span>
              </div>
              <div class="stat-item stat-item-wide">
                <img src="public/assets/icon-button/mining-speed-icon.svg" data-asset="hud.miningSpeed" alt="" />
                <strong>2.0s</strong>
                <span>MINING SPEED</span>
              </div>
              <div class="stat-item stat-item-wide">
                <img src="public/assets/icon-button/cpc-icon.svg" data-asset="hud.cpc" alt="" />
                <strong id="totalMined">12,450</strong>
              </div>
            </footer>
          </div>
          <div class="tap-feedback" id="tapFeedback" aria-hidden="true">+1</div>
        </section>
      </section>
      <p class="sr-status" id="srStatus" aria-live="polite">Opening screen.</p>
    </main>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>

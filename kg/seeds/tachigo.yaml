    name: POST /api/v1/extension/auth/login
    path: services/api
  - kind: DatabaseTable
    name: users
  - kind: DatabaseTable
    name: auth_providers
  - kind: DatabaseTable
    name: refresh_tokens
  - kind: DatabaseTable
    name: points_ledger
  - kind: DatabaseTable
    name: agencies
  - kind: DatabaseTable
    name: transactions
  - kind: Document
    name: README.md
    path: README.md
  - kind: Document
    name: docs/architecture.md
    path: docs/architecture.md
  - kind: Document
    name: docs/auth-architecture.md
    path: docs/auth-architecture.md
  - kind: ExternalSystem
    name: Twitch
  - kind: ExternalSystem
    name: Google OAuth
  - kind: ExternalSystem
    name: Sepolia
  - kind: ExternalSystem
    name: Saleor
  - kind: ExternalSystem
